name: SOLUDESK Windows

# Compila o SOLUDESK do mesmo jeito que o build oficial local:
#   python build.py --portable --flutter   (Flutter 3.47.7, sem hwcodec/vram)
# Saídas: o portátil .exe único (com botão Instalar) e a pasta Release em ZIP.
# A assinatura pela SignPath entra no passo marcado abaixo depois que o projeto
# for aceito e o segredo SIGNPATH_API_TOKEN estiver configurado.

on:
  workflow_dispatch:
    inputs:
      versao:
        description: 'Versão SOLUDESK (igual ao flutter/pubspec.yaml), ex.: 1.0.2'
        required: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.7'
  RUST_VERSION: '1.99.1'
  LLVM_VERSION: '15.0.6'
  VCPKG_COMMIT: '15b12b99a227d51e21c86dffd40385439eac87a0'

jobs:
  windows:
    name: Compilar SOLUDESK Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Conferir versão pedida
        shell: pwsh
        run: |
          $pub = (Select-String -Path flutter/pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          $rs = (Select-String -Path src/platform/windows.rs -Pattern 'SOLUDESK_VERSION: &str = "([^"]+)"').Matches[0].Groups[1].Value
          if ($pub -ne '${{ inputs.versao }}' -or $rs -ne '${{ inputs.versao }}') {
            throw "Versão pedida ${{ inputs.versao }} não bate com o código (pubspec $pub, windows.rs $rs)."
          }
          foreach ($f in 'src/bridge_generated.rs','src/bridge_generated.io.rs','flutter/lib/generated_bridge.dart','flutter/lib/generated_bridge.freezed.dart') {
            if (-not (Test-Path $f)) { throw "Arquivo da ponte Flutter/Rust ausente no commit: $f" }
          }

      - uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Preparar cache do vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\vcpkg-bincache" | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$env:RUNNER_TEMP\vcpkg-bincache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/cache/restore@v4
        id: vcpkg-cache
        with:
          path: ${{ runner.temp }}\vcpkg-bincache
          key: vcpkg-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'res/vcpkg/**', 'res/vcpkg-triplets/**') }}

      # Modo manifesto, igual ao build local: usa o vcpkg.json do repositório
      # e os ports/triplets próprios de res/vcpkg (libvpx, ffmpeg etc.).
      - name: Instalar dependências nativas (vcpkg.json do repositório)
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C "$env:RUNNER_TEMP\vcpkg" checkout --detach "$env:VCPKG_COMMIT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP\vcpkg\vcpkg.exe" install --triplet x64-windows-static --x-install-root="$env:RUNNER_TEMP\vcpkg\installed"
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao instalar dependências do vcpkg.' }
          "VCPKG_ROOT=$env:RUNNER_TEMP\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_INSTALLED_ROOT=$env:RUNNER_TEMP\vcpkg\installed" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Salva o cache já aqui: se a compilação falhar depois, a próxima tentativa
      # não precisa recompilar o ffmpeg e as outras bibliotecas.
      - uses: actions/cache/save@v4
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}\vcpkg-bincache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Compilar (Release + portátil)
        shell: pwsh
        run: |
          python build.py --portable --flutter
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-ChildItem -Path . -Filter 'rustdesk-*-install.exe' | Select-Object -First 1
          if (-not $exe) { $exe = Get-Item 'rustdesk_portable.exe' -ErrorAction Stop }
          New-Item -ItemType Directory -Force saida | Out-Null
          Copy-Item $exe.FullName "saida\SOLUDESK-${{ inputs.versao }}.exe"
          $release = 'flutter\build\windows\x64\runner\Release'
          Compress-Archive -Path "$release\*" -DestinationPath "saida\SOLUDESK-${{ inputs.versao }}-Release.zip"
          Get-ChildItem saida | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $($_.Name)"
          } | Set-Content -Encoding ascii saida\SHA256SUMS.txt
          Get-Content saida\SHA256SUMS.txt

      # Assinatura SignPath: ativar depois da aprovação do projeto.
      # - uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: '<id da organização na SignPath>'
      #     project-slug: 'soludesk'
      #     signing-policy-slug: 'release-signing'
      #     github-artifact-id: '<id do artefato enviado abaixo>'
      #     wait-for-completion: true
      #     output-artifact-directory: 'assinado'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SOLUDESK-${{ inputs.versao }}-windows-nao-assinado
          if-no-files-found: error
          path: saida/
