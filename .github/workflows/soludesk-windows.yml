name: SOLUDESK Windows - candidato sem assinatura

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.7'
  RUST_VERSION: '1.99.1'
  VCPKG_COMMIT: '15b12b99a227d51e21c86dffd40385439eac87a0'

jobs:
  bridge:
    name: Gerar ponte Flutter e Rust
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Instalar ferramentas nativas
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake pkg-config
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Gerar a ponte a partir do código desta revisão
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked
          (cd flutter && flutter pub get --enforce-lockfile)
          flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soludesk-bridge
          if-no-files-found: error
          path: |
            src/bridge_generated.rs
            src/bridge_generated.io.rs
            flutter/lib/generated_bridge.dart
            flutter/lib/generated_bridge.freezed.dart

  windows:
    name: Compilar candidato Windows x64
    needs: bridge
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: soludesk-bridge
          path: .
      - uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: '15.0.6'
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Instalar dependências nativas na revisão definida
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\soludesk-vcpkg"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C "$env:RUNNER_TEMP\soludesk-vcpkg" checkout --detach "$env:VCPKG_COMMIT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP\soludesk-vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location "$env:RUNNER_TEMP\soludesk-vcpkg"
          try {
            & .\vcpkg.exe install libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static aom:x64-windows-static
            if ($LASTEXITCODE -ne 0) { throw 'Falha ao instalar dependências do vcpkg.' }
          } finally { Pop-Location }
          "VCPKG_ROOT=$env:RUNNER_TEMP\soludesk-vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Compilar e empacotar
        shell: pwsh
        run: |
          python build.py --flutter
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath 'rustdesk-1.5.1-install.exe')) { throw 'Executável esperado não foi gerado.' }
          Copy-Item -LiteralPath 'rustdesk-1.5.1-install.exe' -Destination 'SOLUDESK-0.1.0-candidato-nao-assinado.exe'
          (Get-FileHash -Algorithm SHA256 -LiteralPath 'SOLUDESK-0.1.0-candidato-nao-assinado.exe').Hash | Set-Content -Encoding ascii 'SOLUDESK-0.1.0-candidato-nao-assinado.sha256.txt'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SOLUDESK-Windows-candidato-nao-assinado
          if-no-files-found: error
          path: |
            SOLUDESK-0.1.0-candidato-nao-assinado.exe
            SOLUDESK-0.1.0-candidato-nao-assinado.sha256.txt
