name: SOLUDESK Android

# Gera o APK do SOLUDESK para Android a partir do mesmo código do Windows.
# O servidor (vps72894.publiccloud.com.br) e a chave pública vêm fixos do
# hbb_common (features soludesk-*), então o celular conecta nos mesmos PCs.
#
# 1) lib-rust: compila a librustdesk.so para cada processador (em paralelo).
# 2) apk: junta as bibliotecas e gera um APK universal e um por processador.
#
# Assinatura: se os segredos ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS e ANDROID_KEY_PASSWORD existirem, o APK sai assinado com a
# chave oficial do SOLUDESK (necessária para atualizar o app sem desinstalar).
# Sem eles, sai com a chave de depuração do runner (só para teste).

on:
  workflow_dispatch:
    inputs:
      versao:
        description: 'Versão SOLUDESK (igual ao flutter/pubspec.yaml), ex.: 1.0.8'
        required: true
  # O workflow_dispatch só aparece quando o arquivo está no branch padrão; o push
  # neste branch dispara o build sem mexer no branch do Windows.
  push:
    branches: [soludesk-android]

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.7'
  RUST_VERSION: '1.99.1'
  CARGO_NDK_VERSION: '3.1.2'
  NDK_VERSION: 'r28c'
  # Mesmo commit do "baseline" do vcpkg.json.
  VCPKG_COMMIT: '9e593bb18ea69cc5095e012465dcd675a822ed0d'

jobs:
  lib-rust:
    name: Biblioteca Rust ${{ matrix.job.abi }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        job:
          - { abi: arm64-v8a, target: aarch64-linux-android, ndk_script: ndk_arm64.sh, ndk_lib: aarch64-linux-android }
          - { abi: armeabi-v7a, target: armv7-linux-androideabi, ndk_script: ndk_arm.sh, ndk_lib: arm-linux-androideabi }
          - { abi: x86_64, target: x86_64-linux-android, ndk_script: ndk_x64.sh, ndk_lib: x86_64-linux-android }
    steps:
      - name: Liberar espaço em disco
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Instalar pacotes do sistema
        run: |
          sudo apt-get update
          # Mesma lista do build Android do RustDesk: sem gcc-multilib/libc6-dev o bindgen
          # (hwcodec, kcp-sys) não acha bits/libc-header-start.h.
          sudo apt-get install -y clang cmake curl gcc-multilib git g++ g++-multilib libc6-dev \
            libclang-dev libunwind-dev llvm-dev nasm ninja-build pkg-config autoconf automake libtool

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Conferir versão pedida
        run: |
          pub=$(sed -n 's/^version:[[:space:]]*\([0-9.]*\).*/\1/p' flutter/pubspec.yaml)
          if [ -n "${{ inputs.versao }}" ] && [ "$pub" != "${{ inputs.versao }}" ]; then
            echo "Versão pedida ${{ inputs.versao }} não bate com flutter/pubspec.yaml ($pub)"; exit 1
          fi
          for f in src/bridge_generated.rs src/bridge_generated.io.rs; do
            [ -f "$f" ] || { echo "Arquivo da ponte Flutter/Rust ausente no commit: $f"; exit 1; }
          done

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Preparar vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout --detach "$VCPKG_COMMIT"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/vcpkg-bincache"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-bincache" >> "$GITHUB_ENV"

      - uses: actions/cache/restore@v4
        id: vcpkg-cache
        with:
          path: ${{ runner.temp }}/vcpkg-bincache
          key: vcpkg-android-${{ matrix.job.abi }}-${{ env.VCPKG_COMMIT }}-${{ env.NDK_VERSION }}-${{ hashFiles('vcpkg.json', 'res/vcpkg/**', 'res/vcpkg-triplets/**') }}

      - name: Compilar dependências nativas (ffmpeg, libvpx, opus...)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          if ! ./flutter/build_android_deps.sh "${{ matrix.job.abi }}"; then
            find "$VCPKG_ROOT/buildtrees" -name "*.log" -newer vcpkg.json 2>/dev/null | while read -r f; do
              echo "== $f"; tail -n 60 "$f"; done
            exit 1
          fi

      # Salva já aqui: se o Rust falhar depois, a próxima tentativa não recompila o ffmpeg.
      - uses: actions/cache/save@v4
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/vcpkg-bincache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.job.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: soludesk-android
          key: ${{ matrix.job.target }}

      - name: Compilar librustdesk.so
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked
          set -o pipefail
          if ! ./flutter/${{ matrix.job.ndk_script }} 2>&1 | tee cargo.log; then
            # O log do Actions só abre com login; os erros viram anotações (públicas).
            grep -n -E "^error|error\[|panicked|^warning: build failed|failed to run custom build|undefined symbol|could not find" cargo.log \
              | head -n 8 | cut -d: -f1 | while read -r n; do
                msg=$(sed -n "$((n>3?n-3:1)),$((n+25))p" cargo.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
                echo "::error title=cargo ${{ matrix.job.abi }} linha $n::$msg"
              done
            exit 1
          fi
          mkdir -p saida/${{ matrix.job.abi }}
          cp target/${{ matrix.job.target }}/release/liblibrustdesk.so saida/${{ matrix.job.abi }}/librustdesk.so
          cp "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/${{ matrix.job.ndk_lib }}/libc++_shared.so" saida/${{ matrix.job.abi }}/
          # Confere que o servidor do SOLUDESK ficou embutido na biblioteca.
          grep -q "vps72894.publiccloud.com.br" saida/${{ matrix.job.abi }}/librustdesk.so
          ls -la saida/${{ matrix.job.abi }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jnilibs-${{ matrix.job.abi }}
          if-no-files-found: error
          path: saida/

  apk:
    name: Gerar APK
    needs: lib-rust
    runs-on: ubuntu-24.04
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # O build.gradle consulta o "cargo metadata" para achar o rustls-platform-verifier.
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: jnilibs-*
          merge-multiple: true
          path: flutter/android/app/src/main/jniLibs/

      - name: Definir versão
        run: |
          v="${{ inputs.versao }}"
          [ -n "$v" ] || v=$(sed -n 's/^version:[[:space:]]*\([0-9.]*\).*/\1/p' flutter/pubspec.yaml)
          echo "VERSAO=$v" >> "$GITHUB_ENV"

      - name: Configurar assinatura
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx4g/" flutter/android/gradle.properties
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            # Tolera espaços/quebras de linha coladas junto nos segredos.
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 -d > flutter/android/app/soludesk-release.jks
            pw=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n' | sed 's/^Senha do keystore:[[:space:]]*//; s/^[[:space:]]*//; s/[[:space:]]*$//')
            # Alias fixo: não é sigiloso. No PKCS12 a senha da chave é a do keystore.
            if ! keytool -list -keystore flutter/android/app/soludesk-release.jks -storepass "$pw" -alias soludesk >/dev/null 2>&1; then
              echo "::error title=Assinatura::A chave ou a senha dos segredos não abrem o keystore com o alias soludesk. Confira ANDROID_KEYSTORE_BASE64 (conteúdo de keystore.b64) e ANDROID_KEYSTORE_PASSWORD (conteúdo de SO-A-SENHA.txt)."
              exit 1
            fi
            {
              echo "storeFile=soludesk-release.jks"
              echo "storePassword=$pw"
              echo "keyAlias=soludesk"
              echo "keyPassword=$pw"
            } > flutter/android/key.properties
            echo "ASSINATURA=oficial" >> "$GITHUB_ENV"
          else
            echo "::warning::Sem os segredos da chave: APK assinado com a chave de depuração (só para teste)."
            sed -i "s/signingConfigs.release/signingConfigs.debug/" flutter/android/app/build.gradle
            echo "ASSINATURA=teste" >> "$GITHUB_ENV"
          fi

      - name: Compilar APKs
        working-directory: flutter
        run: |
          ls -R android/app/src/main/jniLibs
          set -o pipefail
          anotar() {
            grep -n -E "Error:|error:|What went wrong|FAILURE|Exception" "$1" | head -n 8 | cut -d: -f1 | while read -r n; do
              msg=$(sed -n "$((n>3?n-3:1)),$((n+25))p" "$1" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
              echo "::error title=flutter linha $n::$msg"
            done
          }
          flutter pub get 2>&1 | tee ../flutter.log || { anotar ../flutter.log; exit 1; }
          # Plugins antigos (travados pelo build Windows) ainda citam o embedding v1.
          python3 android/patch_v1_embedding.py .flutter-plugins-dependencies
          flutter build apk --release --target-platform android-arm64,android-arm,android-x64 --android-skip-build-dependency-validation 2>&1 | tee ../flutter.log || { anotar ../flutter.log; exit 1; }
          flutter build apk --release --target-platform android-arm64,android-arm,android-x64 --android-skip-build-dependency-validation --split-per-abi 2>&1 | tee ../flutter.log || { anotar ../flutter.log; exit 1; }
          v="$VERSAO"
          mkdir -p ../saida
          cd build/app/outputs/flutter-apk
          cp app-release.apk "../../../../../saida/SOLUDESK-$v-android-universal.apk"
          cp app-arm64-v8a-release.apk "../../../../../saida/SOLUDESK-$v-android-arm64.apk"
          cp app-armeabi-v7a-release.apk "../../../../../saida/SOLUDESK-$v-android-arm32.apk"
          cp app-x86_64-release.apk "../../../../../saida/SOLUDESK-$v-android-x86_64.apk"
          cd ../../../../
          # Pacote da Play Store (.aab), assinado com a chave de upload (a oficial).
          if [ "$ASSINATURA" = oficial ]; then
            flutter build appbundle --release --target-platform android-arm64,android-arm,android-x64 --android-skip-build-dependency-validation 2>&1 | tee ../flutter.log || { anotar ../flutter.log; exit 1; }
            cp build/app/outputs/bundle/release/app-release.aab "../saida/SOLUDESK-$v-play-store.aab"
          fi

      - name: Hashes
        working-directory: saida
        run: |
          echo "Assinatura: $ASSINATURA" > LEIA-ME.txt
          sha256sum *.apk *.aab 2>/dev/null | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SOLUDESK-${{ env.VERSAO }}-android
          if-no-files-found: error
          path: saida/
